<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#grad)"/>

  <!-- Flower petals -->
  <g transform="translate(256,256)">
    <!-- Top petal -->
    <ellipse cx="0" cy="-80" rx="40" ry="60" fill="#FFE4E1" opacity="0.9"/>
    <!-- Top-right petal -->
    <ellipse cx="56" cy="-56" rx="40" ry="60" fill="#FFE4E1" opacity="0.9" transform="rotate(45 56 -56)"/>
    <!-- Right petal -->
    <ellipse cx="80" cy="0" rx="40" ry="60" fill="#FFE4E1" opacity="0.9" transform="rotate(90 80 0)"/>
    <!-- Bottom-right petal -->
    <ellipse cx="56" cy="56" rx="40" ry="60" fill="#FFE4E1" opacity="0.9" transform="rotate(135 56 56)"/>
    <!-- Bottom petal -->
    <ellipse cx="0" cy="80" rx="40" ry="60" fill="#FFE4E1" opacity="0.9"/>
    <!-- Bottom-left petal -->
    <ellipse cx="-56" cy="56" rx="40" ry="60" fill="#FFE4E1" opacity="0.9" transform="rotate(-135 -56 56)"/>
    <!-- Left petal -->
    <ellipse cx="-80" cy="0" rx="40" ry="60" fill="#FFE4E1" opacity="0.9" transform="rotate(-90 -80 0)"/>
    <!-- Top-left petal -->
    <ellipse cx="-56" cy="-56" rx="40" ry="60" fill="#FFE4E1" opacity="0.9" transform="rotate(-45 -56 -56)"/>

    <!-- Center -->
    <circle cx="0" cy="0" r="35" fill="#FFA500"/>
    <circle cx="0" cy="0" r="25" fill="#FFD700"/>
  </g>

  <!-- Air quality indicator -->
  <g transform="translate(380,380)">
    <circle cx="0" cy="0" r="50" fill="white" opacity="0.3"/>
    <text x="0" y="15" font-size="40" text-anchor="middle" fill="white">AQ</text>
  </g>
</svg>
